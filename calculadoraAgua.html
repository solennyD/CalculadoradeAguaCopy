<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/javaScript.js"></script>
    <link rel="stylesheet" href="css/estilos.css">


    <title>programa con Javascript</title>

</head>


<body>

    <fieldset>
        <header>
            <h1>DESCUBRE LOS LITROS DE AGUA QUE DEBES TOMAR</h1>
        </header>


        <br />
    </fieldset>


    <div class="card">
        <div class="input-group">
          <label for="pesoAgua">Peso (kg):</label>
          <input type="number" id="pesoAgua" class="agua-valor" placeholder="Digite el peso en kg" />
          <button type="button" class="calcular-btn" onclick="CalculadoraAguaKg()">Calcular</button>
        </div>
      </div>

      <div class="card">
        <div class="input-group">
          <label for="pesoAgua">Peso (Lb):</label>
          <input type="number" id="pesoAgua" class="agua-valor" placeholder="Digite el peso en Lb" />
          <button type="button" class="calcular-btn" onclick="CalculadoraAguaLb()">Calcular</button>
        </div>
      </div>
      
      













</body>

</html>
